<section class="modulex-sa2" id="sa2-{{id}}">
  <div class="modulex-sa2-wrap">
    {{sa2head}}
    <div class="modulex-sa2-govde">
      <div class="modulex-sa2-tabs" role="tablist" aria-label="{{listLabel}}" aria-orientation="vertical">{{sa2tabs}}</div>
      <div class="modulex-sa2-panels">{{sa2panels}}</div>
    </div>
  </div>
</section>

<style>
  /* Sekmeli Süreç Adımları (surec-adimlar-2). JS yoksa sekme listesi gizli, paneller alt alta. */
  .modulex-sa2 {
    box-sizing: border-box; width: 100%;
    padding-block: clamp(40px, 7vw, 88px); padding-inline: clamp(16px, 4vw, 32px);
    background: --bgcolor--; color: --textcolor--;
  }
  .modulex-sa2 *, .modulex-sa2 *::before, .modulex-sa2 *::after { box-sizing: border-box; }
  .modulex-sa2 :where(span:not(.material-symbols-outlined), bdi, b, strong, em) { font: inherit; }
  .modulex-sa2-wrap { max-width: --max--; margin-inline: auto; }
  .modulex-sa2-head { max-width: 64ch; margin-block-end: 36px; }
  .modulex-sa2-eyebrow { margin: 0 0 8px; font-size: 0.85rem; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: --accent--; }
  .modulex-sa2-title { margin: 0 0 10px; font-size: clamp(1.6rem, 1.2rem + 1.6vw, 2.4rem); line-height: 1.2; color: --textcolor--; }
  .modulex-sa2-desc { margin: 0; line-height: 1.7; color: --mutedcolor--; }

  .modulex-sa2-govde { display: grid; grid-template-columns: 1fr; gap: 20px; }
  .modulex-sa2-tabs { display: none; }
  .modulex-sa2-panels { display: grid; gap: 16px; }
  .modulex-sa2-panel {
    padding: clamp(24px, 4vw, 48px); border-radius: --radius--; background: --surface--; border: 1px solid --bordercolor--;
  }
  .modulex-sa2-panel:focus-visible { outline: 3px solid --accent--; outline-offset: 3px; }
  .modulex-sa2-pust { display: flex; align-items: center; gap: 16px; margin-bottom: 12px; }
  .modulex-sa2-pno { font-size: clamp(2.6rem, 2rem + 3vw, 4.5rem); font-weight: 800; line-height: 1; color: --accent--; font-variant-numeric: tabular-nums; }
  .modulex-sa2-pikon { display: inline-flex; align-items: center; justify-content: center; width: 52px; height: 52px; border-radius: 50%; background: --accent--; color: --accentText--; }
  .modulex-sa2-petiket { margin: 0 0 4px; font-size: 0.85rem; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; color: --mutedcolor--; }
  .modulex-sa2-h { margin: 0 0 12px; font-size: clamp(1.3rem, 1rem + 1vw, 1.8rem); line-height: 1.25; color: --textcolor--; }
  .modulex-sa2-p { margin: 0; max-width: 60ch; font-size: 1.05rem; line-height: 1.75; color: --mutedcolor--; }
  .modulex-sa2-next {
    display: inline-flex; align-items: center; gap: 6px; min-height: 44px; margin-top: 24px; padding: 0 20px;
    border: 2px solid --accent--; border-radius: 999px; background: transparent; color: --accent--; font: inherit; font-weight: 700; cursor: pointer;
  }
  .modulex-sa2-next:hover { background: --accent--; color: --accentText--; }
  .modulex-sa2-next:focus-visible { outline: 3px solid --accent--; outline-offset: 3px; }
  [dir="rtl"] .modulex-sa2-next .material-symbols-outlined { transform: scaleX(-1); }
  .modulex-sa2:not(.modulex-sa2-js) .modulex-sa2-next { display: none; }

  /* JS etkin: sekme düzeni */
  .modulex-sa2-js .modulex-sa2-govde { grid-template-columns: minmax(220px, 4fr) minmax(0, 8fr); gap: clamp(20px, 3vw, 40px); align-items: start; }
  .modulex-sa2-js .modulex-sa2-tabs { display: flex; flex-direction: column; gap: 6px; }
  .modulex-sa2-js .modulex-sa2-panel[hidden] { display: none; }
  .modulex-sa2-tab {
    display: flex; align-items: center; gap: 14px; width: 100%; min-height: 56px; padding: 10px 14px; text-align: start;
    border: 1px solid transparent; border-radius: 12px; background: transparent; color: --textcolor--; font: inherit; cursor: pointer;
    transition: background-color 0.2s ease, border-color 0.2s ease;
  }
  .modulex-sa2-tab:hover { background: --surface--; }
  .modulex-sa2-tab[aria-selected="true"] { background: --surface--; border-color: --bordercolor--; }
  .modulex-sa2-tab:focus-visible { outline: 3px solid --accent--; outline-offset: 2px; }
  .modulex-sa2-tno {
    flex: 0 0 auto; display: inline-flex; align-items: center; justify-content: center; width: 36px; height: 36px; border-radius: 50%;
    border: 2px solid --accent--; color: --accent--; font-weight: 800; font-variant-numeric: tabular-nums;
  }
  .modulex-sa2-tab[aria-selected="true"] .modulex-sa2-tno { background: --accent--; color: --accentText--; }
  .modulex-sa2-tmetin { display: flex; flex-direction: column; font-weight: 700; line-height: 1.3; }
  .modulex-sa2-tetiket { font-size: 0.78rem; font-weight: 600; color: --mutedcolor--; }

  @media (max-width: 820px) {
    .modulex-sa2-js .modulex-sa2-govde { grid-template-columns: 1fr; }
    .modulex-sa2-js .modulex-sa2-tabs { flex-direction: row; overflow-x: auto; scroll-snap-type: x mandatory; padding-bottom: 4px; }
    .modulex-sa2-tab { flex: 0 0 auto; width: auto; scroll-snap-align: start; }
    [class*="modulex"] { max-width: 100%; box-sizing: border-box; }
  }
  @media (prefers-reduced-motion: reduce) {
    .modulex-sa2 *, .modulex-sa2 *::before, .modulex-sa2 *::after { animation: none !important; transition: none !important; }
  }
</style>

<script>
  /* WAI-ARIA sekme deseni: ok tuşları / Home / End ile gezinme, otomatik etkinleştirme. */
  (function () {
    var kok = document.getElementById("sa2-{{id}}");
    if (!kok || kok.getAttribute("data-sa2-hazir") === "1") { return; }
    kok.setAttribute("data-sa2-hazir", "1");
    var sekmeler = kok.querySelectorAll('[role="tab"]');
    var paneller = kok.querySelectorAll('[role="tabpanel"]');
    if (!sekmeler.length) { return; }
    kok.className += " modulex-sa2-js";
    function sec(i, odakla) {
      var j;
      for (j = 0; j < sekmeler.length; j++) {
        var on = j === i;
        sekmeler[j].setAttribute("aria-selected", on ? "true" : "false");
        if (on) { sekmeler[j].removeAttribute("tabindex"); } else { sekmeler[j].setAttribute("tabindex", "-1"); }
        if (paneller[j]) { paneller[j].hidden = !on; }
      }
      if (odakla) { sekmeler[i].focus(); }
    }
    var i;
    for (i = 0; i < sekmeler.length; i++) {
      (function (n) {
        sekmeler[n].addEventListener("click", function () { sec(n, false); });
        sekmeler[n].addEventListener("keydown", function (e) {
          var hedef = -1;
          var dikey = window.matchMedia && window.matchMedia("(min-width: 821px)").matches;
          var rtl = document.documentElement.dir === "rtl";
          if ((dikey && e.key === "ArrowDown") || (!dikey && e.key === (rtl ? "ArrowLeft" : "ArrowRight"))) { hedef = (n + 1) % sekmeler.length; }
          else if ((dikey && e.key === "ArrowUp") || (!dikey && e.key === (rtl ? "ArrowRight" : "ArrowLeft"))) { hedef = (n - 1 + sekmeler.length) % sekmeler.length; }
          else if (e.key === "Home") { hedef = 0; }
          else if (e.key === "End") { hedef = sekmeler.length - 1; }
          if (hedef !== -1) { e.preventDefault(); sec(hedef, true); }
        });
      })(i);
    }
    var ileri = kok.querySelectorAll("[data-sa2-git]");
    for (i = 0; i < ileri.length; i++) {
      ileri[i].addEventListener("click", function () {
        var n = parseInt(this.getAttribute("data-sa2-git"), 10);
        if (!isNaN(n) && sekmeler[n]) { sec(n, true); }
      });
    }
    sec(0, false);
  })();
</script>
