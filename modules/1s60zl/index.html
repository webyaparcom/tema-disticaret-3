<script>
  (() => {
    const P = "modulex-sayfa-yan-son";
    const az = !!(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches);
    const cekmece = (s, P) => {
          const ac = s.querySelector("." + P + "-mac");
          const menu = ac ? document.getElementById(ac.getAttribute("aria-controls")) : null;
          if (!ac || !menu) return;
          s.classList.add(P + "--js");
          const perde = s.querySelector("." + P + "-perde");
          const kapat = menu.querySelector("." + P + "-mkapat");
          const mq = window.matchMedia("(max-width: 1024px)");
          const kok = document.documentElement;
          const acik = () => s.classList.contains(P + "--acik");
          const kapa = (odak) => {
            if (!acik()) return;
            s.classList.remove(P + "--acik");
            ac.setAttribute("aria-expanded", "false");
            if (perde) perde.hidden = true;
            kok.style.overflow = "";
            if (odak) ac.focus();
          };
          const aci = () => {
            s.classList.add(P + "--acik");
            ac.setAttribute("aria-expanded", "true");
            if (perde) perde.hidden = false;
            if (mq.matches) kok.style.overflow = "hidden";
            const ilk = menu.querySelector("a, summary");
            if (ilk) ilk.focus();
          };
          ac.addEventListener("click", () => (acik() ? kapa(true) : aci()));
          if (kapat) kapat.addEventListener("click", () => kapa(true));
          if (perde) perde.addEventListener("click", () => kapa(true));
          menu.addEventListener("click", (e) => { if (e.target.closest("a")) kapa(false); });
          document.addEventListener("keydown", (e) => { if (e.key === "Escape") kapa(true); });
          const degis = () => { if (!mq.matches) kapa(false); };
          if (mq.addEventListener) mq.addEventListener("change", degis);
        };
    document.querySelectorAll("." + P).forEach((s) => {
      if (s.dataset.fbHazir) return;
      s.dataset.fbHazir = "1";
      cekmece(s, P, az);
    });
  })();
</script>
